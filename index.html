<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EIA Renewable Energy Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Bebas+Neue&family=Source+Sans+3:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#f5f2eb; --surface:#fff; --border:#e0d9cc; --ink:#1a1a18;
  --muted:#8a857a; --solar:#e8a020; --wind:#2a7d4f; --hydro:#2060b0;
  --gas:#e05020; --coal:#1a1a18; --nuclear:#9040c0; --accent:#2a7d4f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Source Sans 3',sans-serif;font-weight:400;min-height:100vh}
.app-header{background:var(--ink);color:#fff;padding:20px 48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-family:'Syne',sans-serif;font-weight:800;font-size:1.45rem;line-height:1}
.app-header h1 span{color:var(--wind)}
.app-header p{font-family:'Source Sans 3',sans-serif;font-size:.73rem;color:#888;margin-top:4px}
.live-badge{display:flex;align-items:center;gap:7px;font-family:'Source Sans 3',sans-serif;font-size:.75rem;color:#aaa}
.dot{width:7px;height:7px;border-radius:50%;background:#4caf50;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.api-bar{background:#fff;border-bottom:2px solid var(--ink);padding:10px 48px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.api-bar label{font-family:'Source Sans 3',sans-serif;font-size:.78rem;color:var(--muted);font-weight:600;white-space:nowrap}
.api-bar input{flex:1;min-width:200px;max-width:340px;border:1.5px solid var(--border);border-radius:4px;padding:6px 10px;font-family:'Source Sans 3',sans-serif;font-size:.79rem;color:var(--ink);outline:none;transition:border-color .2s}
.api-bar input:focus{border-color:var(--accent)}
.load-btn{background:var(--ink);color:#fff;border:none;font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:.73rem;letter-spacing:.04em;padding:7px 18px;border-radius:4px;cursor:pointer;transition:background .2s;white-space:nowrap}
.load-btn:hover{background:var(--accent)}
.load-btn:disabled{opacity:.4;cursor:not-allowed}
.api-bar a{font-family:'Source Sans 3',sans-serif;font-size:.74rem;color:var(--accent);text-decoration:none}
.api-bar a:hover{text-decoration:underline}
.region-bar{background:var(--surface);border-bottom:1.5px solid var(--border);padding:12px 48px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.region-group{display:flex;flex-direction:column;gap:5px;min-width:0}
.region-group-label{font-family:'Source Sans 3',sans-serif;font-size:.71rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.region-pills{display:flex;flex-wrap:wrap;gap:4px}
.region-pills.scrollable{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.region-pills.scrollable::-webkit-scrollbar{height:3px}
.region-pills.scrollable::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.rpill{font-family:'Source Sans 3',sans-serif;font-size:.75rem;padding:4px 11px;border-radius:4px;border:1.5px solid var(--border);cursor:pointer;background:transparent;color:var(--muted);transition:all .15s;white-space:nowrap;flex-shrink:0}
.rpill:hover:not(.active){border-color:var(--ink);color:var(--ink);background:var(--bg)}
.rpill.active.t-national{background:var(--ink);color:#fff;border-color:var(--ink)}
.rpill.active.t-state{background:#1a6bb0;color:#fff;border-color:#1a6bb0}
.rpill.active.t-rto{background:#7030b0;color:#fff;border-color:#7030b0}
.rpill.active.t-region{background:#2a7d4f;color:#fff;border-color:#2a7d4f}
.region-vdiv{width:1px;background:var(--border);align-self:stretch;margin:0 2px}
.app-main{max-width:1300px;margin:0 auto;padding:28px 48px 60px}
.error-box{background:#fff3f3;border:1.5px solid #f0a0a0;border-radius:6px;padding:12px 16px;margin-bottom:22px;font-family:'Source Sans 3',sans-serif;font-size:.71rem;color:#c04040;line-height:1.6;white-space:pre-wrap}
/* GENERATION SUMMARY HEADER */
.gen-summary-header{background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px 8px 0 0;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:0}
.gen-summary-title{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff}
.gen-summary-subtitle{font-family:'Source Sans 3',sans-serif;font-size:.9rem;color:#ccc;font-weight:500}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;margin-bottom:22px}
.kpi-row-divider{grid-column:1/-1;height:0;border-top:1.5px solid var(--border)}
.kpi{background:var(--surface);padding:16px 20px;border-right:1.5px solid var(--border);transition:opacity .4s,transform .4s}
.kpi:last-child{border-right:none}
.kpi-label{font-family:'Source Sans 3',sans-serif;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.kpi-val{font-family:'Source Sans 3',sans-serif;font-size:1.1rem;font-weight:600;line-height:1;margin-bottom:3px;display:flex;align-items:baseline;gap:5px}
.kpi-unit{font-family:'Source Sans 3',sans-serif;font-size:1.1rem;font-weight:600;color:inherit;opacity:0.75}
.kpi-val.solar{color:var(--solar)}.kpi-val.wind{color:var(--wind)}.kpi-val.hydro{color:var(--hydro)}
.kpi-sub{font-size:.75rem;color:var(--muted)}
.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tabs{display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.tab-btn{font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.03em;padding:7px 16px;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:background .15s,color .15s;white-space:nowrap}
.tab-btn:not(:last-child){border-right:1px solid var(--border)}
.tab-btn.active{background:var(--ink);color:#fff}
.tab-btn:hover:not(.active){background:var(--bg);color:var(--ink)}
.ctrl-group{display:flex;align-items:center;gap:6px;font-family:'Source Sans 3',sans-serif;font-size:.76rem;color:var(--muted)}
.pill{font-family:'Source Sans 3',sans-serif;font-size:.76rem;padding:5px 12px;border-radius:4px;border:1.5px solid var(--border);cursor:pointer;background:transparent;color:var(--muted);transition:all .15s}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill:hover:not(.active){border-color:var(--ink);color:var(--ink)}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.freq-badge{font-family:'Source Sans 3',sans-serif;font-size:.74rem;color:var(--muted);white-space:nowrap}
.range-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.range-win{display:flex;align-items:center;gap:0;border:1.5px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.range-win-arrow{font-size:.85rem;padding:4px 9px;background:none;border:none;border-right:1.5px solid var(--border);cursor:pointer;color:var(--muted);font-family:'Source Sans 3',sans-serif;transition:background .12s,color .12s;line-height:1}
.range-win-arrow:last-child{border-right:none;border-left:1.5px solid var(--border)}
.range-win-arrow:hover{background:var(--accent);color:#fff}
.range-win-sep{font-family:'Source Sans 3',sans-serif;font-size:.75rem;color:var(--muted);padding:0 6px;white-space:nowrap;border-right:1.5px solid var(--border)}
.range-win input[type=date]{font-family:'Source Sans 3',sans-serif;font-size:.75rem;padding:4px 8px;border:none;color:var(--ink);outline:none;background:transparent;min-width:0}
.range-win input[type=date]:focus{background:#f0ece0}
.quick-btns{display:flex;gap:4px}
.qr{font-family:'Source Sans 3',sans-serif;font-size:.73rem;padding:3px 9px;border-radius:3px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--muted);transition:all .12s}
.qr.active{background:var(--solar);color:#fff;border-color:var(--solar)}
.qr:hover:not(.active){border-color:var(--ink);color:var(--ink)}
.info-note{font-family:'Source Sans 3',sans-serif;font-size:.74rem;color:#7a5500;background:#fffbee;border:1px solid #e8c840;border-radius:4px;padding:6px 10px;margin-bottom:12px;line-height:1.55}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:20px;transition:opacity .45s,transform .45s}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.tag{font-family:'Source Sans 3',sans-serif;font-size:.71rem;background:var(--bg);border:1px solid var(--border);padding:2px 7px;border-radius:3px}
.cbox{position:relative;height:270px}.cbox.sm{height:220px}.cbox.tall{height:320px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.mb{margin-bottom:16px}

/* LEADERS */
.leaders-card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px}
.leaders-header{padding:16px 20px 0;border-bottom:1.5px solid var(--border)}
.leaders-header-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.leaders-title{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.leaders-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leaders-fetch-btn{background:var(--ink);color:#fff;border:none;font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.04em;padding:6px 14px;border-radius:4px;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.leaders-fetch-btn:hover:not(:disabled){background:var(--accent)}
.leaders-fetch-btn:disabled{opacity:.4;cursor:not-allowed}
.mini-ring{width:11px;height:11px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.source-toggles{display:flex;flex-wrap:wrap;gap:5px;padding-bottom:12px}
.src-toggle{font-family:'Source Sans 3',sans-serif;font-size:.73rem;padding:4px 11px;border-radius:4px;cursor:pointer;border-width:1.5px;border-style:solid;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.leaders-search{padding:10px 20px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leaders-search input{font-family:'Source Sans 3',sans-serif;font-size:.77rem;border:1.5px solid var(--border);border-radius:4px;padding:5px 10px;color:var(--ink);outline:none;width:200px;background:var(--bg);transition:border-color .2s}
.leaders-search input:focus{border-color:var(--accent);background:#fff}
.leaders-search-label{font-family:'Source Sans 3',sans-serif;font-size:.73rem;color:var(--muted)}
.top-n-group{display:flex;align-items:center;gap:5px;margin-left:auto}
.top-n-group span{font-family:'Source Sans 3',sans-serif;font-size:.73rem;color:var(--muted)}
.top-n-btn{font-family:'Source Sans 3',sans-serif;font-size:.73rem;padding:3px 8px;border-radius:3px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--muted);transition:all .12s}
.top-n-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.top-n-btn:hover:not(.active){border-color:var(--ink);color:var(--ink)}
.leaders-table-wrap{overflow-x:auto;max-height:480px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.leaders-table-wrap::-webkit-scrollbar{width:5px;height:5px}
.leaders-table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.leaders-table{width:100%;border-collapse:collapse}
.leaders-table th{position:sticky;top:0;background:var(--bg);font-family:'Source Sans 3',sans-serif;font-size:.73rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--ink);text-align:left;white-space:nowrap;z-index:2;cursor:pointer;user-select:none}
.leaders-table th:hover{color:var(--ink)}
.leaders-table th .sort-arrow{margin-left:3px;opacity:.35}
.leaders-table th.sort-active .sort-arrow{opacity:1;color:var(--accent)}
.leaders-table td{font-family:'Source Sans 3',sans-serif;font-size:.77rem;padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
.leaders-table tr:last-child td{border-bottom:none}
.leaders-table tr:hover td{background:#f8f5ee}
.rank-cell{font-weight:600;color:var(--muted);width:28px}
.rank-cell.top1{color:#c8900a}.rank-cell.top2{color:#707070}.rank-cell.top3{color:#8a5028}
.name-cell{font-weight:600;color:var(--ink)}
.bar-wrap{display:flex;align-items:center;gap:6px}
.bar-track{flex:1;min-width:70px;height:5px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.val-text{font-size:.73rem;color:var(--muted);min-width:54px;text-align:right}
.pct-badge{font-size:.72rem;padding:1px 5px;border-radius:3px;background:var(--bg);border:1px solid var(--border);color:var(--muted);margin-left:3px}
.leaders-empty{text-align:center;padding:52px 20px;font-family:'Source Sans 3',sans-serif;font-size:.72rem;color:var(--muted);line-height:2}
.leaders-empty .empty-icon{font-size:2rem;display:block;margin-bottom:8px;opacity:.25}
.leaders-progress{padding:10px 20px;font-family:'Source Sans 3',sans-serif;font-size:.73rem;color:var(--muted);border-bottom:1px solid var(--border)}
.leaders-progress-bar{width:100%;height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden}
.leaders-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}
.tw-group{display:flex;align-items:center;gap:4px}
.tw-group>span{font-family:'Source Sans 3',sans-serif;font-size:.73rem;color:var(--muted)}

/* TOP-5 SOURCE SELECTOR */
.top5-src-selector{padding:12px 20px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg)}
.top5-src-label{font-family:'Source Sans 3',sans-serif;font-size:.71rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.top5-src-pill{font-family:'Source Sans 3',sans-serif;font-size:.75rem;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;border-width:2px;border-style:solid;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.top5-src-pill:hover{filter:brightness(1.08)}

/* SORT MODE TOGGLE */
.sort-mode-wrap{display:flex;align-items:center;gap:6px;font-family:'Source Sans 3',sans-serif;font-size:.73rem;color:var(--muted)}
.sort-mode-btn{font-family:'Source Sans 3',sans-serif;font-size:.74rem;font-weight:600;padding:5px 13px;border-radius:4px;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--muted);transition:all .15s;white-space:nowrap}
.sort-mode-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.sort-mode-btn:hover:not(.active){border-color:var(--ink);color:var(--ink)}

/* TOP-5 COMPARISON PANEL */
.top5-panel{background:var(--surface);border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:20px}
.top5-header{padding:14px 20px;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:var(--ink)}
.top5-title{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff}
.top5-subtitle{font-family:'Source Sans 3',sans-serif;font-size:.72rem;color:#888;margin-top:3px}
.top5-src-pill{font-family:'Source Sans 3',sans-serif;font-size:.74rem;font-weight:600;padding:4px 12px;border-radius:4px;display:flex;align-items:center;gap:6px}
.top5-grid{display:grid;grid-template-columns:repeat(5,1fr)}
.top5-col{border-right:1px solid var(--border);display:flex;flex-direction:column}
.top5-col:last-child{border-right:none}
.top5-col-header{padding:14px 14px 10px;border-bottom:1px solid var(--border);background:var(--bg)}
.top5-rank-badge{font-family:'Source Sans 3',sans-serif;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:3px;margin-bottom:6px;display:inline-block;letter-spacing:.04em}
.top5-rank-badge.r1{background:#fef3dc;color:#c8900a;border:1px solid #f0d080}
.top5-rank-badge.r2{background:#f0f0f0;color:#606060;border:1px solid #ccc}
.top5-rank-badge.r3{background:#fdf0e8;color:#8a5028;border:1px solid #d4a880}
.top5-rank-badge.r4,.top5-rank-badge.r5{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.top5-state-name{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:700;color:var(--ink);line-height:1.1;margin-bottom:4px;letter-spacing:.02em}
.top5-source-val{font-family:'Source Sans 3',sans-serif;font-size:.75rem;font-weight:600}
.top5-source-pct{font-family:'Source Sans 3',sans-serif;font-size:.7rem;color:var(--muted);display:block;margin-top:1px}
.top5-donut-area{padding:14px 10px 6px;display:flex;justify-content:center;align-items:center;flex:1}
.top5-legend{padding:0 12px 10px}
.top5-legend-row{display:flex;align-items:center;gap:5px;font-family:'Source Sans 3',sans-serif;font-size:.71rem;color:var(--muted);padding:2px 0}
.top5-legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.top5-legend-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5-legend-pct{font-weight:600;color:var(--ink);min-width:34px;text-align:right}
.top5-stats{border-top:1px solid var(--border)}
.top5-stat{padding:6px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.top5-stat:last-child{border-bottom:none}
.top5-stat-label{font-family:'Source Sans 3',sans-serif;font-size:.7rem;color:var(--muted)}
.top5-stat-val{font-family:'Source Sans 3',sans-serif;font-size:.74rem;font-weight:600;color:var(--ink)}

.spinner-overlay{position:fixed;inset:0;background:rgba(245,242,235,.92);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ring{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-overlay p{font-family:'Source Sans 3',sans-serif;font-size:.7rem;color:var(--muted)}
.app-footer{text-align:center;padding:16px;font-family:'Source Sans 3',sans-serif;font-size:.72rem;color:var(--muted);border-top:1px solid var(--border)}

@media(max-width:1000px){
  .top5-grid{grid-template-columns:repeat(3,1fr)}
  .top5-col:nth-child(3){border-right:none}
  .top5-col:nth-child(4),.top5-col:nth-child(5){border-top:1px solid var(--border)}
}
@media(max-width:700px){
  .app-header,.api-bar,.region-bar,.app-main{padding-left:16px;padding-right:16px}
  .kpi-row{grid-template-columns:1fr 1fr}
  .gen-summary-header{border-radius:6px 6px 0 0}
  .kpi:nth-child(2),.kpi:nth-child(4){border-right:none}
  .kpi:nth-child(1),.kpi:nth-child(2){border-bottom:1.5px solid var(--border)}
  .grid2{grid-template-columns:1fr}
  .toolbar{flex-direction:column;align-items:flex-start}
  .region-vdiv{display:none}
  .top5-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const NATIONAL=[{id:"US",label:"United States",type:"national"}];
const STATES=[
  {id:"AL",label:"Alabama",type:"state"},{id:"AK",label:"Alaska",type:"state"},
  {id:"AZ",label:"Arizona",type:"state"},{id:"AR",label:"Arkansas",type:"state"},
  {id:"CA",label:"California",type:"state"},{id:"CO",label:"Colorado",type:"state"},
  {id:"CT",label:"Connecticut",type:"state"},{id:"DE",label:"Delaware",type:"state"},

async function eiaFetch(endpoint,params){
  const key=getEIAKey();
  const url=`https://api.eia.gov/v2${endpoint}?api_key=${encodeURIComponent(key)}&${params.join("&")}`;
  const r=await fetch(url);const j=await r.json();
  if(!r.ok||j.error){const msg=(j.error&&j.error.message)?j.error.message:(typeof j.error==="string"?j.error:("HTTP "+r.status));throw new Error(msg);}

}

async function fetchRTOTotal(respondentId){
  const start=toHourStr(daysBack(8));const end=toHourStr(new Date(Date.now()+24*3600000));
  const rows=await eiaFetch("/electricity/rto/fuel-type-data/data/",[
    "frequency=hourly","data[0]=value",`facets[respondent][]=${respondentId}`,
    `start=${start}`,`end=${end}`,"sort[0][column]=period","sort[0][direction]=asc","length=5000",
  ]);
  const t={id:respondentId,SUN:0,WND:0,WAT:0,NG:0,COL:0,NUC:0,BAT_DIS:0,BAT_CHG:0};
  const rawKeys=new Set(rows.map(r=>r.fueltype));const hasBATKey=rawKeys.has("BAT");
  rows.forEach(r=>{
    const v=parseFloat(r.value)||0;
    if(r.fueltype==="BAT"){if(v>0)t.BAT_DIS+=v;else t.BAT_CHG+=Math.abs(v);}
    else if(!hasBATKey&&r.fueltype==="OTH"){if(v>0)t.BAT_DIS+=v;else t.BAT_CHG+=Math.abs(v);}
    else if(t[r.fueltype]!==undefined)t[r.fueltype]+=v;
  });
  t.SUN=Math.max(0,t.SUN);t.WND=Math.max(0,t.WND);
  t.total=Object.entries(t).filter(([k])=>k!=="id").reduce((s,[,v])=>s+Math.max(0,v),0);
  return t;
}
function utcPeriodToTz(p,tz){

  const get=t=>parts.find(p=>p.type===t)?.value??"00";const hr=get("hour")==="24"?"00":get("hour");
  return `${get("year")}-${get("month")}-${get("day")}T${hr}`;
}
function fmtTzPeriod(p,tz){

  const[yr,mo,dy]=datePart.split("-");

  return `${mn[parseInt(mo,10)-1]} ${parseInt(dy,10)}, ${hrPart}:00`;
}
function groupMonthly(rows){

}
function groupHourly(rows,tz){
  const byP={};const rawKeys=new Set();
  rows.forEach(r=>{const k=utcPeriodToTz(r.period,tz);if(!byP[k])byP[k]={};rawKeys.add(r.fueltype);byP[k][r.fueltype]=(byP[k][r.fueltype]||0)+(parseFloat(r.value)||0);});
  const hasBATKey=rawKeys.has("BAT");
  Object.values(byP).forEach(d=>{
    if(hasBATKey){const rb=d.BAT||0;d.BAT_DIS=rb>0?rb:0;d.BAT_CHG=rb<0?Math.abs(rb):0;delete d.BAT;}
    else{const ro=d.OTH||0;if(ro>0){d.BAT_DIS=(d.BAT_DIS||0)+ro;d.OTH=0;}else if(ro<0){d.BAT_CHG=(d.BAT_CHG||0)+Math.abs(ro);d.OTH=0;}d.BAT_DIS=d.BAT_DIS||0;d.BAT_CHG=d.BAT_CHG||0;}
    if(d.SUN)d.SUN=Math.max(0,d.SUN);if(d.WND)d.WND=Math.max(0,d.WND);

function renewBarConfig(pp,byP,hourly,unit,tz){if(!pp.length)return null;const fm=hourly?HOURLY_FUELS:MONTHLY_FUELS,rk=hourly?RENEW_H:RENEW_M;return{type:"bar",data:{labels:pp,datasets:rk.map(f=>({label:fm[f].label,data:pp.map(p=>toU(byP[p]?.[f]||0,unit)),backgroundColor:fm[f].color+"bb",borderColor:fm[f].color,borderWidth:0,stack:"s"}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{labels:{color:CD.tick,font:{family:"'Source Sans 3'",size:10}}},tooltip:{...CD.tip,callbacks:{title:tipTitle(tz),label:c=>` ${c.dataset.label}: ${fmtTip(c.parsed.y,unit)}`}}},scales:{x:{...mkX(tz),stacked:true},y:mkY(unit,true)}}};}
function groupPieConfig(pp,byP,hourly,unit){if(!pp.length)return null;const d=sumPeriods(pp,byP);const rk=hourly?RENEW_H:RENEW_M,fossils=hourly?["NG","COL"]:["NG","COW"];const renew=rk.reduce((s,f)=>s+(d[f]||0),0);const fossil=fossils.reduce((s,f)=>s+(d[f]||0),0);const nuc=d.NUC||0;return{type:"pie",data:{labels:["Renewables","Fossil Fuels","Nuclear"],datasets:[{data:[toU(renew,unit),toU(fossil,unit),toU(nuc,unit)],backgroundColor:["#2a7d4f","#e05020","#9040c0"],borderColor:"#fff",borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{color:CD.tick,font:{family:"'Source Sans 3'",size:10},padding:10}},tooltip:{...CD.tip,callbacks:{label:c=>` ${c.label}: ${fmtTip(c.parsed,unit)}`}}}}};}
function genChangeConfig(pp,byP,hourly,unit){if(pp.length<2)return null;const fm=hourly?HOURLY_FUELS:MONTHLY_FUELS;const mid=Math.floor(pp.length/2);const sumH=ps=>{const t={};ps.forEach(p=>{const d=byP[p]||{};Object.entries(d).forEach(([k,v])=>{t[k]=(t[k]||0)+v;});});return t;};const s1=sumH(pp.slice(0,mid)),s2=sumH(pp.slice(mid));const ORDER=hourly?["SUN","WND","WAT","NUC","COL","NG"]:["SUN","WND","HYC","NUC","COW","NG"];const items=ORDER.map(f=>{const m=fm[f];if(!m)return null;const v1=s1[f]||0,v2=s2[f]||0;const pct=v1>0?((v2-v1)/v1*100):null;return pct!==null?{label:m.label,color:m.color,pct}:null;}).filter(Boolean);return{type:"bar",data:{labels:items.map(x=>x.label),datasets:[{data:items.map(x=>x.pct),backgroundColor:items.map(x=>x.pct>=0?"#2a7d4f44":"#e0502044"),borderColor:items.map(x=>x.pct>=0?"#2a7d4f":"#e05020"),borderWidth:1.5,borderRadius:3}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...CD.tip,callbacks:{label:c=>` ${c.parsed.x>0?"+":""}${c.parsed.x.toFixed(1)}%`}}},scales:{x:{ticks:{color:CD.tick,font:CD.font,callback:v=>(v>0?"+":"")+v.toFixed(1)+"%"},grid:{color:CD.grid}},y:{ticks:{color:CD.tick,font:{...CD.font,size:10}},grid:{display:false}}}}};}

// ── Inline SVG donut wheel (no Chart.js, avoids canvas reuse issues in a grid) ──
function DonutWheel({data,fuels,size=140}){
  const valid=fuels.filter(f=>Math.max(0,data[f.key]||0)>0);
  const total=valid.reduce((s,f)=>s+Math.max(0,data[f.key]||0),0);
  if(total===0)return<div style={{width:size,height:size,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Source Sans 3',sans-serif",fontSize:".7rem",color:"var(--muted)"}}>No data</div>;
  const cx=size/2,cy=size/2,R=size/2-6,r=R*0.56;
  const slices=[];let angle=-Math.PI/2;
  valid.forEach(f=>{
    const pct=Math.max(0,data[f.key]||0)/total;
    const sweep=pct*2*Math.PI-0.02; // small gap
    const x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle);
    const x2=cx+R*Math.cos(angle+sweep),y2=cy+R*Math.sin(angle+sweep);
    const xi1=cx+r*Math.cos(angle),yi1=cy+r*Math.sin(angle);
    const xi2=cx+r*Math.cos(angle+sweep),yi2=cy+r*Math.sin(angle+sweep);
    const large=sweep>Math.PI?1:0;
    const path=`M${xi1.toFixed(2)} ${yi1.toFixed(2)} L${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${xi2.toFixed(2)} ${yi2.toFixed(2)} A${r} ${r} 0 ${large} 0 ${xi1.toFixed(2)} ${yi1.toFixed(2)} Z`;
    slices.push({path,color:f.color,key:f.key});
    angle+=pct*2*Math.PI;
  });
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block"}}>
      {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke="#fff" strokeWidth="1.5"/>)}
      <circle cx={cx} cy={cy} r={r-1} fill="white"/>
    </svg>
  );
}

// ── Top-5 Comparison Panel ──────────────────────────────────────────────────
const RANK_BADGES=["r1","r2","r3","r4","r5"];
const RANK_MEDALS=["1st","2nd","3rd","4th","5th"];

function Top5Panel({top5,wheelKey,onWheelKey,sortKey,fuels,unit,isRTO}){
  if(!top5||top5.length===0)return null;
  const wheelFuel=fuels.find(f=>f.key===wheelKey)||fuels[0];
  return(
    <div className="top5-panel">
      <div className="top5-header">
        <div>
          <div className="top5-title">Top 5 {isRTO?"Grid Operators":"States"} — {wheelFuel.label} Leaders</div>
          <div className="top5-subtitle">Full energy mix · select a source below to re-rank and update wheels · units: {unit}</div>
        </div>
      </div>

      {/* Source selector — clicking re-sorts the table AND updates wheels */}
      <div className="top5-src-selector">
        <span className="top5-src-label">Source:</span>
        {fuels.map(f=>{
          const on=wheelKey===f.key;
          return(
            <button key={f.key} className="top5-src-pill"
              onClick={()=>onWheelKey(f.key)}
              style={{borderColor:f.color,background:on?f.color:f.color+"18",color:on?"#fff":f.color,boxShadow:on?`0 2px 8px ${f.color}44`:"none"}}>
              <span style={{width:"7px",height:"7px",borderRadius:"50%",background:on?"rgba(255,255,255,.8)":f.color,flexShrink:0}}/>
              {f.label}
            </button>
          );
        })}
      </div>

      <div className="top5-grid">
        {top5.map((d,i)=>{
          const allFuels=fuels.filter(f=>Math.max(0,d[f.key]||0)>0);
          const total=allFuels.reduce((s,f)=>s+Math.max(0,d[f.key]||0),0);
          const srcVal=Math.max(0,d[wheelKey]||0);
          const srcPct=total>0?(srcVal/total*100):0;
          const renewKeys=isRTO?["SUN","WND","WAT","BAT_DIS"]:["SUN","WND","HYC"];
          const renewTotal=renewKeys.reduce((s,k)=>s+Math.max(0,d[k]||0),0);
          const renewPct=total>0?(renewTotal/total*100):0;
          const topFuels=[...allFuels].sort((a,b)=>Math.max(0,d[b.key]||0)-Math.max(0,d[a.key]||0)).slice(0,6);

          return(
            <div key={d.id} className="top5-col">
              <div className="top5-col-header">
                <div className={`top5-rank-badge ${RANK_BADGES[i]}`}>{RANK_MEDALS[i]}</div>
                <div className="top5-state-name">{d.name||d.shortName}</div>
                {d.name!==d.shortName&&<div style={{fontFamily:"'Source Sans 3',sans-serif",fontSize:".7rem",color:"var(--muted)",marginBottom:"4px"}}>{d.shortName}</div>}
                <div style={{marginTop:"2px"}}>
                  <span className="top5-source-val" style={{color:wheelFuel.color}}>
                    {fmtVal(srcVal,unit)} <span style={{fontSize:".7rem",opacity:.7}}>{unit}</span>
                  </span>
                  <span className="top5-source-pct">{wheelFuel.label}: {srcPct.toFixed(1)}% of mix</span>
                </div>
              </div>

              <div className="top5-donut-area">
                <DonutWheel data={d} fuels={fuels} size={148}/>
              </div>

              <div className="top5-legend">
                {topFuels.map(f=>{
                  const val=Math.max(0,d[f.key]||0);
                  const pct=total>0?(val/total*100):0;
                  if(pct<0.5)return null;
                  return(
                    <div key={f.key} className="top5-legend-row">
                      <span className="top5-legend-dot" style={{background:f.color}}/>
                      <span className="top5-legend-name" style={{color:f.key===wheelKey?f.color:"var(--muted)",fontWeight:f.key===wheelKey?600:400}}>{f.label}</span>
                      <span className="top5-legend-pct" style={{color:f.key===wheelKey?f.color:"var(--ink)"}}>{pct.toFixed(1)}%</span>
                    </div>
                  );
                })}
              </div>

              <div className="top5-stats">
                <div className="top5-stat">
                  <span className="top5-stat-label">Total generation</span>
                  <span className="top5-stat-val">{fmtVal(total,unit)} {unit}</span>
                </div>
                <div className="top5-stat">
                  <span className="top5-stat-label">Renewables share</span>
                  <span className="top5-stat-val" style={{color:"var(--wind)"}}>{renewPct.toFixed(1)}%</span>
                </div>
                <div className="top5-stat">
                  <span className="top5-stat-label" style={{color:wheelFuel.color}}>{wheelFuel.label}</span>
                  <span className="top5-stat-val" style={{color:wheelFuel.color}}>{fmtVal(srcVal,unit)} {unit}</span>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Leaders Tab ──────────────────────────────────────────────────────────────
function LeadersTab({unit,currentRegionType}){
  const isRTO=currentRegionType==="rto";
  const FUELS=isRTO?LEADERS_FUELS_R:LEADERS_FUELS_M;
  const[leaderData, setLeaderData]=useState([]);
  const[loading,    setLoading   ]=useState(false);
  const[progress,   setProgress  ]=useState(0);
  const[progressMsg,setProgressMsg]=useState("");
  const[error,      setError     ]=useState("");
  const[visibleSrcs,setVisibleSrcs]=useState(()=>new Set(LEADERS_FUELS_M.map(f=>f.key)));
  const[sortKey,    setSortKey   ]=useState(()=>LEADERS_FUELS_M[0].key);
  const[sortDir,    setSortDir   ]=useState("desc");
  const[sortMode,   setSortMode  ]=useState("qty"); // "qty" | "pct"
  const[search,     setSearch    ]=useState("");
  const[topN,       setTopN      ]=useState(20);
  const[timeWindow, setTimeWindow]=useState(12);
  const[loadedWindow,setLoadedWindow]=useState(null);

  useEffect(()=>{
    setLeaderData([]);setError("");setLoadedWindow(null);
    const nf=isRTO?LEADERS_FUELS_R:LEADERS_FUELS_M;
    setVisibleSrcs(new Set(nf.map(f=>f.key)));
    setSortKey(nf[0].key);
  },[isRTO]);

  const load=useCallback(async()=>{
    setLoading(true);setError("");setLeaderData([]);setProgress(0);
    try{
      if(isRTO){
        // 9 operators — fully parallel
        setProgressMsg("Fetching all grid operators…");
        const results=await Promise.all(
          RTOS.map(async r=>{
            const tot=await fetchRTOTotal(r.id);
            return{...tot,name:r.fullName,shortName:r.label};
          })
        );
        setLeaderData(results);setLoadedWindow("last 7 days");
      } else {
        // 50 states — fully parallel, stream results in as each arrives
        setProgressMsg("Fetching states...");
        let done=0;
        const resultsMap=new Map();
        await Promise.all(
          STATES.map(async s=>{
            const tot=await fetchStateTotal(s.id,timeWindow);
            resultsMap.set(s.id,{...tot,name:STATE_NAMES[s.id]||s.label,shortName:s.id});
            done++;
            const pct=Math.round((done/STATES.length)*100);
            setProgress(pct);
            setProgressMsg(`${done}/${STATES.length} states loaded…`);
            // stream results in as they arrive so top5 updates live
            setLeaderData(STATES.map(st=>resultsMap.get(st.id)).filter(Boolean));
          })
        );
        setLoadedWindow(`last ${timeWindow} months`);
      }
      setProgress(100);
    }catch(e){const msg=(e&&e.message)?e.message:String(e);setError("ERROR- "+msg+(msg.includes("429")?"\n\nRate limit hit — paste your free EIA key above and retry.":""));}
    finally{setLoading(false);}
  },[isRTO,timeWindow]);

  const handleSort=useCallback(key=>{setSortKey(prev=>{if(prev===key){setSortDir(d=>d==="desc"?"asc":"desc");return prev;}setSortDir("desc");return key;});},[]);
  const toggleSrc=useCallback(key=>{setVisibleSrcs(prev=>{const n=new Set(prev);if(n.has(key)&&n.size>1)n.delete(key);else n.add(key);return n;});},[]);

  const visibleFuels=FUELS.filter(f=>visibleSrcs.has(f.key));
  // precompute row totals for % mode
  const rowTotals=useMemo(()=>{const m={};leaderData.forEach(d=>{m[d.id]=FUELS.reduce((s,f)=>s+Math.max(0,d[f.key]||0),0);});return m;},[leaderData,isRTO]);
  const getSortVal=useCallback((d,key)=>{
    if(key==="name")return d.name;
    if(key==="total")return FUELS.reduce((s,f)=>s+Math.max(0,d[f.key]||0),0);
    const raw=Math.max(0,d[key]||0);
    if(sortMode==="pct"){const t=rowTotals[d.id]||1;return raw/t*100;}
    return raw;
  },[sortMode,rowTotals,isRTO]);
  const colMax=useMemo(()=>{const mx={};FUELS.forEach(f=>{const vals=leaderData.map(d=>{const raw=Math.max(0,d[f.key]||0);if(sortMode==="pct"){const t=rowTotals[d.id]||1;return raw/t*100;}return raw;});mx[f.key]=Math.max(...vals,0.0001);});return mx;},[leaderData,sortMode,rowTotals,isRTO]);
  const allSorted=useMemo(()=>[...leaderData].sort((a,b)=>{const av=getSortVal(a,sortKey);const bv=getSortVal(b,sortKey);if(sortKey==="name")return sortDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);return sortDir==="desc"?bv-av:av-bv;}),[leaderData,sortKey,sortDir,getSortVal]);
  const top5=useMemo(()=>allSorted.slice(0,5),[allSorted]);
  const filtered=useMemo(()=>{let rows=allSorted.filter(d=>!search||d.name.toLowerCase().includes(search.toLowerCase())||d.shortName.toLowerCase().includes(search.toLowerCase()));return topN?rows.slice(0,topN):rows;},[allSorted,search,topN]);

  const timeWindows=[{label:"3M",months:3},{label:"6M",months:6},{label:"1Y",months:12},{label:"2Y",months:24},{label:"3Y",months:36}];
  const sortFuelMeta=FUELS.find(f=>f.key===sortKey)||FUELS[0];

  return(
    <div>
      <div className="info-note">
        <strong>{isRTO?"Grid Operator":"State"} Leaders</strong> fetches all {isRTO?"9 grid operators":"50 states"} from EIA
        ({isRTO?"9":"~50"} API calls). A <strong>free personal EIA key</strong> is strongly recommended.
        {!isRTO&&" Select time window then Load States."}
      </div>

      {/* Top-5 Comparison */}
      {leaderData.length>0&&<Top5Panel top5={top5} wheelKey={sortKey} onWheelKey={handleSort} sortKey={sortKey} fuels={FUELS} unit={unit} isRTO={isRTO}/>}

      {/* Rankings table */}
      <div className="leaders-card">
        <div className="leaders-header">
          <div className="leaders-header-top">
            <div>
              <div className="leaders-title">{isRTO?"Grid Operator":"State"} Rankings — All Sources</div>
              {loadedWindow&&<div style={{fontFamily:"'Source Sans 3',sans-serif",fontSize:".72rem",color:"var(--muted)",marginTop:"4px"}}>
                {leaderData.length} {isRTO?"operators":"states"} · {loadedWindow} · sorting by {sortMode==="pct"?"% of total mix":"absolute generation"} · click header to change source
              </div>}
            </div>
            <div className="leaders-controls">
              {!isRTO&&(
                <div className="tw-group">
                  <span>Window:</span>
                  {timeWindows.map(w=><button key={w.label} className={`top-n-btn${timeWindow===w.months?" active":""}`} onClick={()=>setTimeWindow(w.months)}>{w.label}</button>)}
                </div>
              )}
              <div className="sort-mode-wrap">
                <span>Sort by:</span>
                <button className={`sort-mode-btn${sortMode==="qty"?" active":""}`} onClick={()=>setSortMode("qty")}>Quantity</button>
                <button className={`sort-mode-btn${sortMode==="pct"?" active":""}`} onClick={()=>setSortMode("pct")}>% of mix</button>
              </div>
              <button className="leaders-fetch-btn" onClick={load} disabled={loading}>
                {loading&&<span className="mini-ring"/>}
                {loading?progressMsg||"Loading…":loadedWindow?"↻ Refresh":`Load ${isRTO?"Operators":"States"}`}
              </button>
            </div>
          </div>

          {/* Column toggles */}
          <div style={{marginBottom:"4px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}}>
              <span style={{fontFamily:"'Source Sans 3',sans-serif",fontSize:".71rem",color:"var(--muted)",textTransform:"uppercase",letterSpacing:".07em"}}>Columns:</span>
              <button onClick={()=>setVisibleSrcs(new Set(FUELS.map(f=>f.key)))} style={{fontFamily:"'Source Sans 3',sans-serif",fontSize:".71rem",padding:"2px 8px",border:"1px solid var(--border)",borderRadius:"3px",cursor:"pointer",background:"transparent",color:"var(--muted)"}}>All</button>
              <button onClick={()=>setVisibleSrcs(new Set(isRTO?["SUN","WND","WAT","BAT_DIS"]:["SUN","WND","HYC"]))} style={{fontFamily:"'Source Sans 3',sans-serif",fontSize:".71rem",padding:"2px 8px",border:"1px solid var(--border)",borderRadius:"3px",cursor:"pointer",background:"transparent",color:"var(--muted)"}}>Renewables</button>

                <button key={f.key} className="src-toggle" onClick={()=>toggleSrc(f.key)}
                  style={{borderColor:active?f.color:on?f.color+"77":"var(--border)",background:on?f.color+"18":"transparent",color:on?f.color:"var(--muted)",fontWeight:active?700:on?500:400,boxShadow:active?`0 0 0 2px ${f.color}33`:"none"}}>
                  <span style={{width:"7px",height:"7px",borderRadius:"50%",background:on?f.color:"transparent",border:`1.5px solid ${f.color}`,flexShrink:0}}/>
                  {f.label}{active&&" ↓"}
                </button>
              );})}
            </div>
          </div>
        </div>

        {loading&&<div className="leaders-progress"><span>{progressMsg}</span><div className="leaders-progress-bar"><div className="leaders-progress-fill" style={{width:`${progress}%`}}/></div></div>}
        {error&&<div className="error-box" style={{margin:"12px 20px"}}>{error}</div>}

        {leaderData.length>0&&(
          <div className="leaders-search">
            <span className="leaders-search-label">Filter:</span>
            <input type="text" placeholder={isRTO?"Search operator…":"Search state…"} value={search} onChange={e=>setSearch(e.target.value)}/>
            <div className="top-n-group">
              <span>Show:</span>
              {[10,20,50,0].map(n=><button key={n} className={`top-n-btn${topN===n?" active":""}`} onClick={()=>setTopN(n)}>{n===0?"All":n}</button>)}
            </div>
          </div>
        )}

        {leaderData.length===0&&!loading&&(
          <div className="leaders-empty">
            <span className="empty-icon"></span>
            Click <strong>Load {isRTO?"Operators":"States"}</strong> to rank all {isRTO?"9 grid operators":"50 US states"} by energy source.
          </div>
        )}

        {leaderData.length>0&&(
          <div className="leaders-table-wrap">
            <table className="leaders-table">
              <thead>
                <tr>
                  <th style={{width:"32px"}}>#</th>
                  <th className={sortKey==="name"?"sort-active":""} onClick={()=>handleSort("name")}>{isRTO?"Operator":"State"}<span className="sort-arrow">{sortKey==="name"?(sortDir==="desc"?"↓":"↑"):"↕"}</span></th>
                  {visibleFuels.map(f=>(
                    <th key={f.key} className={sortKey===f.key?"sort-active":""} onClick={()=>handleSort(f.key)} style={{color:sortKey===f.key?f.color:"var(--muted)"}}>
                      <div style={{display:"flex",alignItems:"center",gap:"4px"}}>
                        <span style={{width:"7px",height:"7px",borderRadius:"50%",background:f.color,flexShrink:0,display:"inline-block"}}/>
                        {f.label}<span className="sort-arrow">{sortKey===f.key?(sortDir==="desc"?"↓":"↑"):"↕"}</span>
                      </div>
                    </th>
                  ))}
                  <th className={sortKey==="total"?"sort-active":""} onClick={()=>handleSort("total")}>Total<span className="sort-arrow">{sortKey==="total"?(sortDir==="desc"?"↓":"↑"):"↕"}</span></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((d)=>{
                  const globalRank=allSorted.findIndex(x=>x.id===d.id);
                  const rankCls=globalRank===0?"rank-cell top1":globalRank===1?"rank-cell top2":globalRank===2?"rank-cell top3":"rank-cell";
                  const inTop5=globalRank<5;
                  const rowTotal=d.total||0;
                  return(
                    <tr key={d.id} style={{background:inTop5?"#f8f5ee":""}}>
                      <td className={rankCls}>{globalRank+1}</td>
                      <td className="name-cell">
                        {d.name}
                        {d.name!==d.shortName&&<span style={{fontFamily:"'Source Sans 3',sans-serif",fontSize:".7rem",color:"var(--muted)",marginLeft:"5px"}}>{d.shortName}</span>}
                      </td>
                      {visibleFuels.map(f=>{
                        const raw=Math.max(0,d[f.key]||0);
                        const mixPct=rowTotal>0?(raw/rowTotal*100):0;
                        // bar always shows share of this state's total mix — matches the badge
                        const barWidth=Math.min(100,mixPct);
                        return(
                          <td key={f.key}>
                            <div className="bar-wrap">
                              <div className="bar-track"><div className="bar-fill" style={{width:`${barWidth}%`,background:f.color+(sortKey===f.key?"":"99")}}/></div>
                              {sortMode==="pct"
                                ? <span className="val-text">{mixPct.toFixed(1)}%</span>
                                : <><span className="val-text">{fmtVal(raw,unit)}</span><span className="pct-badge">{mixPct.toFixed(1)}%</span></>
                              }
                            </div>
                          </td>
                        );
                      })}
                      <td style={{fontFamily:"'Source Sans 3',sans-serif",fontSize:".77rem",color:"var(--muted)"}}>{sortMode==="pct"?"100.0%":fmtVal(rowTotal,unit)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function RegionBar({selected,onChange}){
  return(
    <div className="region-bar">
      <div className="region-group"><div className="region-group-label">National</div><div className="region-pills">{NATIONAL.map(r=><button key={r.id} className={`rpill t-national${selected.id===r.id?" active":""}`} onClick={()=>onChange(r)}>{r.label}</button>)}</div></div>
      <div className="region-vdiv"/>
      <div className="region-group" style={{width:"350px",flexShrink:0}}><div className="region-group-label">US Regions · Monthly</div><div className="region-pills scrollable">{US_REGIONS.map(r=><button key={r.id} className={`rpill t-region${selected.id===r.id?" active":""}`} onClick={()=>onChange(r)}>{r.label}</button>)}</div></div>
      <div className="region-vdiv"/>
      <div className="region-group" style={{flex:1,minWidth:0}}><div className="region-group-label">States · Monthly</div><div className="region-pills scrollable">{STATES.map(r=><button key={r.id} className={`rpill t-state${selected.id===r.id?" active":""}`} onClick={()=>onChange(r)}>{r.label}</button>)}</div></div>
      <div className="region-vdiv"/>
      <div className="region-group" style={{width:"350px",flexShrink:0}}><div className="region-group-label">Grid Operators · Hourly</div><div className="region-pills scrollable">{RTOS.map(r=><button key={r.id} className={`rpill t-rto${selected.id===r.id?" active":""}`} onClick={()=>onChange(r)}>{r.label}</button>)}</div></div>
    </div>
  );
}

function App(){
  const[loading,  setLoading ]=useState(false);
  const[loadMsg,  setLoadMsg ]=useState("Fetching data…");
  const[error,    setError   ]=useState("");
  const[hasData,  setHasData ]=useState(false);
  const[region,   setRegion  ]=useState(NATIONAL[0]);
  const[data,     setData    ]=useState({byP:{},periods:[]});
  const[activeTab,setActiveTab]=useState("overview");
  const[unit,     setUnit    ]=useState("MWh");
  const[fromDate, setFromDate]=useState(null);
  const[toDate,   setToDate  ]=useState(null);
  const[activeQ,  setActiveQ ]=useState("1Y");
  const[kpiVis,   setKpiVis  ]=useState(true);
  const[tabVis,   setTabVis  ]=useState(true);

  const hourly=region.type==="rto";
  const freqLabel=hourly?"Hourly":"Monthly";
  const quickList=hourly
    ?[{label:"6H",hours:6},{label:"12H",hours:12},{label:"24H",hours:24},{label:"3D",hours:72},{label:"7D",hours:168}]
    :[{label:"1M",same:true},{label:"2M",months:2},{label:"3M",months:3},{label:"6M",months:6},{label:"1Y",months:12},{label:"2Y",months:24},{label:"All",months:0}];

  const filteredPeriods=useMemo(()=>{let pp=data.periods;if(fromDate)pp=pp.filter(p=>p>=fromDate);if(toDate)pp=pp.filter(p=>p<=toDate);return pp;},[data.periods,fromDate,toDate]);
  const anchorFrom=useCallback(months=>{const all=data.periods;if(!all.length)return null;return all[Math.max(0,all.length-months)];},[data.periods]);
  const anchorHourly=useCallback(hours=>{const all=data.periods;if(!all.length)return null;return all[Math.max(0,all.length-hours)];},[data.periods]);

  useEffect(()=>{const t=setTimeout(()=>loadRegion(NATIONAL[0]),0);return()=>clearTimeout(t);},[]);
  useEffect(()=>{if(!data.periods.length)return;if(hourly){setFromDate(anchorHourly(72));setToDate(null);setActiveQ("3D");}else{setFromDate(null);setToDate(null);setActiveQ("All");};},[data]);
  useEffect(()=>{setTabVis(false);const t=setTimeout(()=>setTabVis(true),60);return()=>clearTimeout(t);},[activeTab,unit,filteredPeriods.length,region.id]);

  const applyQuick=useCallback(q=>{setActiveQ(q.label);if(hourly){setFromDate(q.hours?anchorHourly(q.hours):null);setToDate(null);}else if(q.same){setFromDate(data.periods[data.periods.length-1]||null);setToDate(null);}else{setFromDate(q.months?anchorFrom(q.months):null);setToDate(null);};},[hourly,anchorFrom,anchorHourly,data.periods]);
  const shiftWindow=useCallback(dir=>{const all=data.periods;if(!all.length)return;const vs=fromDate?all.findIndex(p=>p>=fromDate):0;const ve=toDate?all.findIndex(p=>p>toDate):all.length;const end=ve===-1?all.length:ve;const ws=end-vs;if(ws<=0)return;if(dir===-1){const ns=Math.max(0,vs-ws);const ne=ns+ws;setFromDate(all[ns]);setToDate(all[Math.min(ne-1,all.length-1)]);}else{const ne=Math.min(all.length,end+ws);const ns=ne-ws;setFromDate(all[Math.max(ns,0)]);setToDate(all[ne-1]);}setActiveQ("");},[data.periods,fromDate,toDate]);

  const loadRegion=useCallback(async r=>{
    const rto=r.type==="rto";setLoadMsg(`Fetching ${rto?"hourly":"monthly"} data for ${r.label}…`);setLoading(true);setError("");
    try{
      let rows,grouped;
      if(rto){rows=await fetchHourlyRTO(r.id);grouped=groupHourly(rows,r.tz||"UTC");grouped.tz=r.tz||"UTC";}
      else if(r.type==="region"){rows=await fetchMonthlyMulti(r.states);grouped=groupMonthly(rows);grouped.tz=null;}
      else{rows=await fetchMonthlyRegion(r.id);grouped=groupMonthly(rows);grouped.tz=null;}
      if(!rows.length)throw new Error(`No data returned for ${r.label}. DEMO_KEY has strict rate limits — try a free personal key.`);
      setData(grouped);setHasData(true);setKpiVis(false);setTimeout(()=>setKpiVis(true),100);
    }catch(e){const msg=(e&&e.message)?e.message:(typeof e==="string"?e:JSON.stringify(e));const is429=msg.includes("429")||msg.includes("rate limit")||msg.includes("Too Many");setError("ERROR- "+msg+(is429?"\n\nDEMO_KEY rate limit reached. Paste a free personal key above and click Reload.":"\n\nTip: New EIA keys can take 5-10 minutes to activate."));}
    finally{setLoading(false);}
  },[]);

  const run=useCallback(async()=>{await loadRegion(region);},[region,loadRegion]);
  const handleRegionChange=useCallback(r=>{setRegion(r);loadRegion(r);},[loadRegion]);

  const kpiTotals=useMemo(()=>{const t={solar:0,wind:0,hydro:0,coal:0,gas:0,nuclear:0,total:0};filteredPeriods.forEach(p=>{const d=data.byP[p]||{};t.solar+=d["SUN"]||0;t.wind+=d["WND"]||0;t.hydro+=d[hourly?"WAT":"HYC"]||0;t.coal+=d[hourly?"COL":"COW"]||0;t.gas+=d["NG"]||0;t.nuclear+=d["NUC"]||0;t.total+=Object.values(d).filter(v=>v>0).reduce((s,v)=>s+v,0);});return t;},[filteredPeriods,data.byP,hourly]);
  const share=kpiTotals.total>0?((kpiTotals.solar+kpiTotals.wind+kpiTotals.hydro)/kpiTotals.total*100).toFixed(1):"—";
  const rangeLabel=filteredPeriods.length>1?`${filteredPeriods[0]} – ${filteredPeriods[filteredPeriods.length-1]}`:(filteredPeriods[0]||"");
  const fromInput=(()=>{const p=filteredPeriods[0]||"";if(!p)return"";return p.length===7?p+"-01":p.slice(0,10);})();
  const toInput=(()=>{const p=filteredPeriods[filteredPeriods.length-1]||"";if(!p)return"";return p.length===7?p+"-01":p.slice(0,10);})();

  return<>
    {loading&&<div className="spinner-overlay"><div className="ring"/><p>{loadMsg}</p></div>}
    <header className="app-header">
      <div><h1>EIA <span>Renewables</span> Dashboard</h1><p>Live data · U.S. Energy Information Administration (EIA) · API v2</p></div>
      <div className="live-badge"><div className="dot"/><span>{hasData?`${region.label} · ${freqLabel} · ${filteredPeriods[filteredPeriods.length-1]||""}`:"Awaiting data"}</span></div>
    </header>
    <div className="api-bar">
      <label>EIA API KEY</label>
      <input id="eia-key-input" type="text" placeholder="Paste your EIA key for higher rate limits…" defaultValue="" onKeyDown={e=>e.key==="Enter"&&run()}/>
      <button className="load-btn" onClick={run} disabled={loading}>{loading?"LOADING…":"RELOAD"}</button>
      <a href="https://www.eia.gov/opendata/register.php" target="_blank" rel="noreferrer">Get free key →</a>
    </div>
    <RegionBar selected={region} onChange={handleRegionChange}/>
    <main className="app-main">
      {error&&<div className="error-box">{error}</div>}
      <div className="gen-summary-header">
        <div className="gen-summary-title">Generation Summary</div>
        {rangeLabel&&<div className="gen-summary-subtitle">{rangeLabel} · {unit}</div>}
      </div>
      <div className="kpi-row">
        {[{label:"Solar Generation",value:fmtKPI(kpiTotals.solar,unit),unit:fmtKPIUnit(kpiTotals.solar,unit),cls:"solar"},{label:"Wind Generation",value:fmtKPI(kpiTotals.wind,unit),unit:fmtKPIUnit(kpiTotals.wind,unit),cls:"wind"},{label:"Hydro Generation",value:fmtKPI(kpiTotals.hydro,unit),unit:fmtKPIUnit(kpiTotals.hydro,unit),cls:"hydro"},{label:"Renewables Share",value:share,unit:share!=="—"?"%":null,cls:""}].map((k,i)=>(
          <div key={k.label} className={`kpi${kpiVis?" visible":""}`} style={{transitionDelay:`${i*70}ms`}}>
            <div className="kpi-label">{k.label}</div><div className={`kpi-val${k.cls?" "+k.cls:""}`}>{k.value}{k.unit&&<span className="kpi-unit">{k.unit}</span>}</div>{k.sub&&<div className="kpi-sub">{k.sub}</div>}
          </div>
        ))}
        <div className="kpi-row-divider"/>
        {[{label:"Coal Generation",value:fmtKPI(kpiTotals.coal,unit),unit:fmtKPIUnit(kpiTotals.coal,unit),cls:""},{label:"Gas Generation",value:fmtKPI(kpiTotals.gas,unit),unit:fmtKPIUnit(kpiTotals.gas,unit),cls:""},{label:"Nuclear Generation",value:fmtKPI(kpiTotals.nuclear,unit),unit:fmtKPIUnit(kpiTotals.nuclear,unit),cls:""},{label:"Total Generation",value:fmtKPI(kpiTotals.total,unit),unit:fmtKPIUnit(kpiTotals.total,unit),cls:""}].map((k,i)=>(
          <div key={k.label} className={`kpi${kpiVis?" visible":""}`} style={{transitionDelay:`${(i+4)*70}ms`}}>
            <div className="kpi-label">{k.label}</div><div className={`kpi-val${k.cls?" "+k.cls:""}`}>{k.value}{k.unit&&<span className="kpi-unit">{k.unit}</span>}</div>
          </div>
        ))}
      </div>
      <div className="toolbar">
        <div className="tabs">
          {[["overview","Overview"],["trend","Trend"],["mix","Energy Mix"],["leaders","Leaders"]].map(([t,l])=>(
            <button key={t} className={`tab-btn${activeTab===t?" active":""}`} onClick={()=>setActiveTab(t)}>{l}</button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}}>
          <span className="freq-badge">{region.label} · {hourly?"Hourly":"Monthly"}</span>
          <div className="sep"/>
          <div className="ctrl-group"><span>Units:</span>{["MWh","GWh","TWh"].map(u=><button key={u} className={`pill${unit===u?" active":""}`} onClick={()=>setUnit(u)}>{u}</button>)}</div>
        </div>
      </div>
      {activeTab!=="leaders"&&(
        <div className="range-bar">
          <div className="range-win">
            <button className="range-win-arrow" onClick={()=>shiftWindow(-1)}>&#8592;</button>
            <input type="date" value={fromInput} onChange={e=>setFromDate(e.target.value?(hourly?e.target.value+"T00":e.target.value.slice(0,7)):null)}/>
            <span className="range-win-sep">to</span>
            <input type="date" value={toInput} onChange={e=>setToDate(e.target.value?(hourly?e.target.value+"T23":e.target.value.slice(0,7)):null)}/>
            <button className="range-win-arrow" onClick={()=>shiftWindow(1)}>&#8594;</button>
          </div>
          <div className="quick-btns">{quickList.map(q=><button key={q.label} className={`qr${activeQ===q.label?" active":""}`} onClick={()=>applyQuick(q)}>{q.label}</button>)}</div>
        </div>
      )}
      {activeTab!=="leaders"&&hourly&&<div className="info-note"><strong>{region.label}</strong> ({region.id}) · Hourly RTO data · WAT=Hydro, COL=Coal · Times in {region.tz||"UTC"} · Last 7 days</div>}
      {activeTab!=="leaders"&&!hourly&&<div className="info-note">Monthly EIA data typically publishes with a 2–3 month lag -- Showing all available data by default</div>}
      {activeTab==="overview"&&<OverviewTab pp={filteredPeriods} byP={data.byP} hourly={hourly} unit={unit} visible={tabVis} freqLabel={freqLabel} tz={data.tz||null}/>}
      {activeTab==="trend"   &&<TrendTab    pp={filteredPeriods} byP={data.byP} hourly={hourly} unit={unit} visible={tabVis} freqLabel={freqLabel} tz={data.tz||null}/>}
      {activeTab==="mix"     &&<MixTab      pp={filteredPeriods} byP={data.byP} hourly={hourly} unit={unit} visible={tabVis} freqLabel={freqLabel} tz={data.tz||null}/>}
      {activeTab==="leaders" &&<LeadersTab  unit={unit} currentRegionType={region.type}/>}
    </main>
    <footer className="app-footer">
      Built by Adam Lawit · Source: U.S. Energy Information Administration (EIA) · API v2 · electric-power-operational-data (national/state monthly) · electricity/rto/fuel-type-data (RTO hourly)
    </footer>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
